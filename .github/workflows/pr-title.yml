# Squash-merges take the PR title as the commit on main, so the title must
# itself be a valid conventional commit (see docs/BRANCHING.md).
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    uses: akhiakl/ci-workflows/.github/workflows/conventional-pr-title.yml@47cd9620ed2b9d879185db5fd2887c5db64cff79 # v1
