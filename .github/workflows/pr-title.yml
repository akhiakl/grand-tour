# Squash-merges take the PR title as the commit on main, so the title must
# itself be a valid conventional commit (see docs/BRANCHING.md).
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    uses: akhiakl/ci-workflows/.github/workflows/conventional-pr-title.yml@1984db16417cc763ea3e0904bfca2533e0ab0869 # v1
