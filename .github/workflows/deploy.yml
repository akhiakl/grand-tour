# Production deploys ONLY from published releases (tags vX.Y.Z) — never
# from pushes to main (Vercel's Ignored Build Step skips those). The Vercel
# CLI deploy below is not subject to that skip. See docs/RELEASE.md for the
# policy and the MVP checklist gating v1.0.0. Without VERCEL_TOKEN it logs
# and exits.
name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_limfPNcBoq9EgLcZU3PIRK8J
  VERCEL_PROJECT_ID: prj_s5JbG1NXUZmlPut6nTqrpW4aJE1W

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Skip when VERCEL_TOKEN is unset
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set; release is a tag only."
      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - name: Build and deploy ${{ github.event.release.tag_name }}
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
