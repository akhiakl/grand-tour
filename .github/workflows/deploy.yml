# Production deploys ONLY from published releases (tags vX.Y.Z) — never
# from pushes to main. See docs/RELEASE.md for the policy and the MVP
# checklist gating v1.0.0. Without DEPLOY_HOOK_URL it logs and exits.
name: Deploy

on:
  release:
    types: [published]

jobs:
  production:
    uses: akhiakl/ci-workflows/.github/workflows/deploy-hook.yml@v1.1.0
    secrets: inherit
