# SonarQube Cloud project binding — verify both keys against the project's
# Information page (they follow the GitHub org/repo convention).
sonar.projectKey=akhiakl_grand-tour
sonar.organization=akhiakl
sonar.projectName=Grand Tour

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/test/**

# Coverage: produced by `pnpm test:coverage` (vitest v8 → lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

# Mirror vitest's coverage scope: the tested core is lib + API routes;
# UI components/pages are covered by Playwright e2e later, not unit coverage.
sonar.coverage.exclusions=src/components/**,src/hooks/**,src/app/**/*.tsx,src/app/**/*.css,src/instrumentation.ts,src/instrumentation-client.ts,src/lib/utils.ts,src/test/**

# Vendored shadcn primitives follow upstream shape; skip duplication checks.
sonar.cpd.exclusions=src/components/ui/**
