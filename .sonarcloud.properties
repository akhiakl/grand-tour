# SonarQube Cloud Automatic Analysis scope (no CI job, no token).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/test/**

# Vendored shadcn primitives follow upstream shape; skip duplication checks.
sonar.cpd.exclusions=src/components/ui/**
